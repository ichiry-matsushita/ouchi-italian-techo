# main に push されたら、記事をチェックしてからビルドし、GitHub Pages に公開する。
# チェックでエラーがあると、ビルドと公開は行われない。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 記事のチェック
        run: npm run check:articles

      - name: ビルド
        run: npm run build
        env:
          # https://<ユーザー名>.github.io/<リポジトリ名>/ で公開するため
          PATH_PREFIX: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
